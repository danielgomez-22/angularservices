<h1>Plantillas Obtenidas</h1>
<select [(ngModel)]="funcionSeleccionada">
    <option value="" disabled selected>Seleccione una función</option>
    @for (plant of arrayPlantillas; track plant) {
        <option [value]="plant">{{ plant }}</option>
    }
</select>
<button (click)="mostrarPlantilla()">Mostrar plantilla</button>

@if (empleadosFiltrados.length > 0) {
    <table border="1" style="margin-top: 15px; width: 100%; border-collapse: collapse;">
        <thead>
            <tr>
                <th>Apellido</th>
                <th>Función</th>
                <th>Turno</th>
                <th>Salario</th>
            </tr>
        </thead>
        <tbody>
            @for (emp of empleadosFiltrados; track emp.idEmpleado) {
                <tr>
                    <td>{{ emp.apellido }}</td>
                    <td>{{ emp.funcion }}</td>
                    <td>{{ emp.turno }}</td>
                    <td>{{ emp.salario }}</td>
                </tr>
            }
        </tbody>
    </table>
}
